<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 264px;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      #status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
        flex-shrink: 0;
      }
      #status.rec .dot {
        background: #ef4444;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      #setup {
        font-size: 10px;
        color: var(--amber);
        background: var(--warn-bg);
        border-radius: 8px;
        padding: 6px 10px;
        margin-bottom: 10px;
        line-height: 1.5;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .nav .btn {
        font-size: 12px;
        padding: 7px 6px;
      }
      #lastSession {
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1.5;
        min-height: 14px;
        margin-bottom: 12px;
      }
      .settings-block {
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .settings-block .label {
        font-size: 10.5px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .key-row {
        display: flex;
        gap: 6px;
      }
      #key-status {
        font-size: 10px;
        color: var(--green);
        min-height: 12px;
        margin-top: 4px;
      }
      #ver {
        margin-top: 8px;
        font-size: 9px;
        color: var(--muted);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../icons/icon128.png" class="logo" alt="" />
      <h1>NoteAssist</h1>
    </header>
    <div id="status"><span class="dot"></span><span id="status-text">checking…</span></div>
    <div id="setup" style="display: none"></div>
    <div class="actions">
      <button id="start" class="btn btn-primary">Start</button>
      <button id="stop" class="btn">Stop</button>
    </div>
    <div class="nav">
      <button id="open-notes" class="btn">Notes</button>
      <button id="open-history" class="btn">History</button>
      <button id="open-analytics" class="btn">Stats</button>
      <button id="open-settings" class="btn">Settings</button>
    </div>
    <div id="lastSession"></div>
    <div class="settings-block">
      <div class="label">Groq API key · free at console.groq.com</div>
      <div class="key-row">
        <input id="api-key" type="password" placeholder="gsk_..." />
        <button id="save-key" class="btn">Save</button>
      </div>
      <div id="key-status"></div>
    </div>
    <div id="ver"></div>
    <script src="popup.js"></script>
  </body>
</html>
