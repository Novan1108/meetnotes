<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="icon" href="icon32.png" />
    <title>MeetNotes — analytics</title>
    <style>
      body {
        position: relative;
      }
      .back {
        position: absolute;
        top: 16px;
        left: 0;
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
      }
      .back:hover {
        text-decoration: underline;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 6px;
      }
      .card,
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .card .n {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .card .l {
        font-size: 10.5px;
        color: var(--muted);
      }
      .stat .n {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .stat .l {
        font-size: 10.5px;
        color: var(--muted);
      }
      .bar {
        height: 14px;
        border-radius: 7px;
        overflow: hidden;
        display: flex;
        background: var(--surface-2);
      }
      .bar .you {
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
      }
      .bar .others {
        background: #f59e0b;
      }
      .overall {
        height: 18px;
      }
      .legend {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        text-align: left;
        padding: 7px 4px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 11px;
      }
      .mini {
        display: inline-flex;
        width: 120px;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        background: var(--surface-2);
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="page">
    <header class="topbar">
      <a class="brand" href="history.html"><img src="icon32.png" alt="" />MeetNotes</a>
      <nav>
        <a href="notes.html">Notes</a>
        <a href="history.html">History</a>
        <a href="analytics.html" class="on">Stats</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>
    <h1>Analytics</h1>
    <div id="root"></div>
    <div id="ver" class="muted" style="font-size: 10px; margin: 18px 0"></div>
    <script src="analytics.js"></script>
  </body>
</html>
