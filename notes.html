<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="icon" href="icon32.png" />
    <title>MeetNotes — notes</title>
    <style>
      body {
        position: relative;
      }
      .back {
        position: absolute;
        top: 16px;
        left: 0;
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
      }
      .back:hover {
        text-decoration: underline;
      }
      header.page-head {
        margin-top: 30px;
        margin-bottom: 18px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      header .btn-row {
        display: flex;
        gap: 8px;
      }
      #copy,
      #notion-push {
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font: 12px system-ui;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      #copy:hover,
      #notion-push:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }
      .error {
        background: var(--err-bg);
        color: var(--red);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 12px;
        margin-bottom: 14px;
      }
      section h2 {
        margin-bottom: 6px;
      }
      ul {
        margin: 4px 0;
        padding-left: 20px;
      }
      li {
        margin-bottom: 5px;
      }
      .owner {
        display: inline-block;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
        border-radius: 999px;
        padding: 0 8px;
        font-size: 11px;
        margin-left: 6px;
      }
      .ev {
        display: inline-block;
        background: var(--surface-2);
        color: var(--muted);
        border-radius: 6px;
        padding: 0 6px;
        font-size: 10px;
        margin-left: 6px;
        text-decoration: none;
      }
      .ev:hover {
        color: var(--accent);
      }
      details {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 16px;
        background: var(--surface);
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        user-select: none;
      }
      .seg {
        margin: 3px 0;
        line-height: 1.55;
      }
      .seg:target {
        background: var(--warn-bg);
        border-radius: 6px;
        padding: 2px 6px;
        margin: 6px -6px;
      }
      .t {
        color: var(--muted);
        font-size: 10.5px;
        margin-right: 6px;
        font-variant-numeric: tabular-nums;
      }
      .who-you {
        font-weight: 600;
        color: var(--accent);
      }
    </style>
  </head>
  <body class="page">
    <header class="topbar">
      <a class="brand" href="history.html"><img src="icon32.png" alt="" />MeetNotes</a>
      <nav>
        <a href="notes.html" class="on">Notes</a>
        <a href="history.html">History</a>
        <a href="analytics.html">Stats</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: -40px; margin-bottom: 4px">
      <button id="copy" hidden>Copy as markdown</button>
      <button id="notion-push">Push to Notion</button>
    </div>
    <h1>Meeting notes</h1>
    <div id="meta" class="muted" style="font-size: 12px; margin-bottom: 20px"></div>
    <div id="content"></div>
    <script src="notes.js"></script>
  </body>
</html>
